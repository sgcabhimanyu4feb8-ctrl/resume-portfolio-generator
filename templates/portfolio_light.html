<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ portfolio.name }} — Portfolio</title>
    <meta name="description" content="{{ portfolio.summary[:160] if portfolio.summary else portfolio.name + ' portfolio' }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
    /* ===== LIGHT MINIMAL THEME ===== */
    :root {
        --bg: #f8fafc;
        --surface: #fff;
        --card: #fff;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --text: #0f172a;
        --text-2: #475569;
        --muted: #94a3b8;
        --accent: #6366f1;
        --accent2: #0ea5e9;
        --accent3: #10b981;
        --danger: #ef4444;
        --gradient: linear-gradient(135deg, #6366f1, #0ea5e9);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        min-height: 100vh;
    }
    
    /* ===== SIDEBAR LAYOUT ===== */
    .layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
    }
    /* ===== SIDEBAR ===== */
    aside {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 3rem 2rem;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
    }
    .avatar {
        width: 72px; height: 72px;
        border-radius: 50%;
        background: var(--gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        font-size: 1.8rem;
